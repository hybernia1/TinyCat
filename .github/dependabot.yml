version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
      composer-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']
