name: Quality gates

on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: PHP 8.4 release preflight
    # Keep the reviewed Playwright 1.52 / WebKit 18.4 regression environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tinycat_ci
          MYSQL_ROOT_PASSWORD: tinycat-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptinycat-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, sodium, zip, gd
          coverage: none
          tools: composer:v2

      - name: Set up Node.js for frontend contract tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prefer the Ubuntu archive mirror
        run: |
          # Hosted images may use mirror+file rather than a direct Ubuntu URI.
          # Keep the image's other mirrors as failover, with lower priority.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('/etc/apt/apt-mirrors.txt')
          lines = ['https://archive.ubuntu.com/ubuntu/\tpriority:1']
          for line in path.read_text().splitlines():
              if re.match(r'https?://archive\.ubuntu\.com/ubuntu/?(?:\s|$)', line):
                  continue
              if line.strip() and not line.lstrip().startswith('#'):
                  line = re.sub(r'\s+priority:\d+', '', line)
                  line += '\tpriority:2'
              lines.append(line)
          path.write_text('\n'.join(lines) + '\n')
          PY
            cat /etc/apt/apt-mirrors.txt
          fi
          # Fallback for images using direct sources instead of a mirror list.
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i -E 's#https?://([a-zA-Z0-9.-]+\.ec2|azure)\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' "$source_file"
              echo "--- $source_file"
              cat "$source_file"
            fi
          done

      - name: Install pinned browser tooling
        run: npm install --prefix "$RUNNER_TEMP/tinycat-webkit" --no-audit --no-fund playwright@1.52.0 axe-core@4.10.3

      - name: Install WebKit system dependencies
        run: node "$RUNNER_TEMP/tinycat-webkit/node_modules/playwright/cli.js" install-deps webkit

      - name: Download WebKit regression browser
        run: |
          node "$RUNNER_TEMP/tinycat-webkit/node_modules/playwright/cli.js" install webkit
          echo "TINYCAT_TEST_PLAYWRIGHT_MODULE=$RUNNER_TEMP/tinycat-webkit/node_modules/playwright" >> "$GITHUB_ENV"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install development tools
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure disposable MySQL tests
        run: cp tests/fixtures/config.ci.php config.php

      - name: Run release preflight
        run: composer preflight

      - name: Upload measured preflight reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-${{ github.sha }}
          path: .work/tests/runs/**/report.json
          if-no-files-found: warn
